<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <main class="auth-main">
        <section class="auth-page">

            <div class="auth-section active">
                <div class="auth-header">
                    <h2>To-Do App</h2>
                    <p>Stay organized every day</p>
                </div>

                <div class="auth-form">
                    <h3>Update Password</h3>

                    <form id="update-password-form">
                        <label for="new-password">New Password</label>
                        <div class="password-box">
                            <input id="new-password" type="password" placeholder="Enter new password" required>
                            <button class="password-toggle" type="button" data-password="new-password">Show</button>
                        </div>

                        <label for="confirm-new-password">Confirm Password</label>
                        <div class="password-box">
                            <input id="confirm-new-password" type="password" placeholder="Confirm new password" required>
                            <button class="password-toggle" type="button" data-password="confirm-new-password">Show</button>
                        </div>

                        <button type="submit">Update Password</button>
                    </form>

                    <p id="update-password-message" class="form-message"></p>

                    <a href="auth.html">Back to Login</a>
                </div>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>

</body>
</html>
